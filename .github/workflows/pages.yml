name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build slides to site/
        run: |
          mkdir -p site
          npx --yes @marp-team/marp-cli@^4.0.1 -I slides \
            --theme-set themes/shintia.css --html --allow-local-files -o site
          cp -r assets site/assets
          cp index.html site/index.html
      - name: Install LibreOffice (for PPTX export)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice

      - name: Build slides (PPTX)
        run: npx --yes @marp-team/marp-cli@^4.0.1 -I slides --theme-set themes/shintia.css --html --pptx --pptx-editable --allow-local-files -o site --parallel 1 --browser-timeout 120

      - name: Build materials to site/materials
        run: node scripts/build-materials.js site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
